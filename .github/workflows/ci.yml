name: Build EnhancedStreamChat

on:
  workflow_dispatch:
  push:
    paths:
      - '**.cs'
      - '**.csproj'
      - '**.props'
      - '**.json'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - '**.cs'
      - '**.csproj'
      - '**.props'
      - '**.json'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build BS ${{ matrix.game-version }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - game-version: 1.40.8

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.202

      - name: Pin plugin build SDK
        shell: pwsh
        run: |
          $globalJson = Get-Content global.json -Raw | ConvertFrom-Json
          $globalJson.sdk.version = '8.0.202'
          $globalJson.sdk.rollForward = 'disable'
          $globalJson | ConvertTo-Json -Depth 5 | Set-Content global.json
          if ((dotnet --version) -ne '8.0.202') {
            throw "Expected .NET SDK 8.0.202, found $(dotnet --version)."
          }

      - name: Initialize Beat Saber references
        uses: beat-forge/init-beatsaber@v1
        with:
          token: ${{ github.token }}
          version: ${{ matrix.game-version }}
          path: ${{ github.workspace }}\Refs

      - name: Download BeatMods dependencies
        uses: Aeroluna/download-beatmods-deps@main
        with:
          game-version: ${{ matrix.game-version }}
          project-path: EnhancedStreamChat.csproj
          project-configuration: Release
          path: ${{ github.workspace }}\Refs
          additional-dependencies: '{"BeatSaberMarkupLanguage":"^1.12.3","BS Utils":"^1.14.2","SiraUtil":"^3.1.12","CameraUtils":"^1.0.7"}'

      - name: Checkout current CatCore
        uses: actions/checkout@v4
        with:
          repository: lyyQwQ/CatCore
          ref: main
          path: catcore

      - name: Move CatCore checkout outside project tree
        shell: pwsh
        run: |
          Move-Item catcore "$env:RUNNER_TEMP\catcore" -Force

      - name: Build current CatCore
        shell: pwsh
        run: |
          dotnet restore "$env:RUNNER_TEMP\catcore\CatCore.sln"
          $ilRepack = Get-ChildItem "$env:USERPROFILE\.nuget\packages\ilrepack" -Recurse -Filter ILRepack.exe | Sort-Object FullName -Descending | Select-Object -First 1
          if ($null -eq $ilRepack) {
            throw 'ILRepack.exe was not restored for CatCore.'
          }
          dotnet build "$env:RUNNER_TEMP\catcore\CatCore\CatCore.csproj" --configuration Release --no-restore --nologo "-p:ILRepack=$($ilRepack.FullName)"

      - name: Stage current CatCore
        shell: pwsh
        run: |
          Copy-Item "$env:RUNNER_TEMP\catcore\CatCore\bin\Release\netstandard2.0\Artifact\Libs\CatCore.dll" Refs/Libs/CatCore.dll -Force
          Copy-Item "$env:RUNNER_TEMP\catcore\CatCore\bin\Release\netstandard2.0\Artifact\Libs\CatCore.xml" Refs/Libs/CatCore.xml -Force

      - name: Remove conflicting netstandard facade
        shell: pwsh
        run: |
          $netstandard = 'Refs\Beat Saber_Data\Managed\netstandard.dll'
          if (Test-Path $netstandard) {
            Move-Item $netstandard "$env:RUNNER_TEMP\netstandard.dll.disabled" -Force
          }

      - name: Restore dependencies
        run: dotnet restore EnhancedStreamChat.sln -p:BeatSaberDir=${{ github.workspace }}\Refs

      - name: Build
        run: >-
          dotnet build EnhancedStreamChat.sln
          --configuration Release
          --no-restore
          -p:BeatSaberGameVersion=${{ matrix.game-version }}
          -p:BeatSaberDir=${{ github.workspace }}\Refs
          -p:GameDirectory=${{ github.workspace }}\artifacts
          -p:ArtifactDestination=${{ github.workspace }}\artifacts

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EnhancedStreamChat-bs${{ matrix.game-version }}
          path: |
            artifacts/Plugins/EnhancedStreamChat.dll
            artifacts/Plugins/EnhancedStreamChat.pdb
            artifacts/UserData/**
